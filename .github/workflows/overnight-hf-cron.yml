name: overnight-hf-cron

# N5-WATCH: dedicated schedule trigger (separate from push/dispatch workflow).
# GitHub schedule on combined workflows can be delayed; this thin cron wrapper
# shares concurrency group with overnight-hf-publish.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: overnight-hf-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash -s
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # products/claimguard/claimguard.py imports cryptography at module level for
      # Ed25519 verification. It was never installed, so the "Product doors on Hub"
      # step died on ModuleNotFoundError every run.
      - name: Install Python deps used by the pack (cryptography for claimguard)
        run: pip install --quiet cryptography

      - name: Probe OIDC publishers (N5-01 preflight)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            bash scripts/overnight-hf-oidc-probe.sh
          else
            echo "HF_TOKEN set — skipping OIDC probe"
          fi

      - name: Publish HF exports (N5-01..N5-06)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/overnight-hf-publish.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify overnight pack (N5-VERIFY)
        env:
          STRICT: "1"
        run: bash ops/verify-overnight-pack.sh

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-publish-logs
          path: ops/logs/
          if-no-files-found: ignore
