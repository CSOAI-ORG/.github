name: harness-ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly — also keeps the repo active

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install engine deps
        run: pip install "cryptography>=42" pytest
      - name: Editable-install ClaimGuard
        run: pip install -e products/claimguard
      - name: Run monorepo batch (lint + tests + e2e)
        run: node scripts/run-all.mjs
