name: overnight-hf-publish

# N5-01..N5-06: HF datasets + Space publish (ClaimGuard gated).
#
# Auth (either path):
#   A) HF_TOKEN repo secret (write/admin on org csoai), OR
#   B) HF Trusted Publishers OIDC — configure on each HF repo:
#        Provider: GitHub Actions
#        repository = CSOAI-ORG/.github
#        branch     = main
#        workflow   = overnight-hf-publish.yml
#      Repos: datasets/csoai/gspc-board, datasets/csoai/gspc-bench-results,
#             datasets/csoai/gspc-leaderboard-results, spaces/csoai/gspc-governance-leaderboard
#      Pre-create gspc-leaderboard-results on HF if missing (OIDC is repo-scoped).

on:
  workflow_dispatch:
  # Auto-run on main merge when export artifacts change (bypasses workflow_dispatch 403 for agents).
  # Auth: HF_TOKEN secret OR Trusted Publishers OIDC (see header comments).
  push:
    branches: [main]
    paths:
      - 'export/**'
      - 'scripts/overnight-hf-publish.sh'
      - '.github/workflows/overnight-hf-publish.yml'
  # N5-WATCH: retry every 15m overnight — succeeds once owner adds HF_TOKEN or OIDC publishers.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  id-token: write   # required for Trusted Publishers OIDC exchange
  contents: read

concurrency:
  group: overnight-hf-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash -s
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Probe OIDC publishers (N5-01 preflight)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            bash scripts/overnight-hf-oidc-probe.sh
          else
            echo "HF_TOKEN set — skipping OIDC probe"
          fi

      - name: Publish HF exports (N5-01..N5-06)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/overnight-hf-publish.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify overnight pack (N5-VERIFY)
        env:
          STRICT: "1"
        run: bash ops/verify-overnight-pack.sh

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-publish-logs
          path: ops/logs/
          if-no-files-found: ignore
