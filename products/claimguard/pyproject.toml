[project]
name = "claimguard"
version = "0.2.0"
description = "Claim-vs-signed-artifact integrity checker for GSPC boards + EU AI Act Article 50 / C2PA provenance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CSOAI Ltd", email = "nicholas@csoai.org" }]
dependencies = ["cryptography>=42"]

[project.scripts]
claimguard = "claimguard:main"

[tool.setuptools]
py-modules = ["claimguard", "canonical", "c2pa"]
